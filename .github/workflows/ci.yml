name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  deploy:
    name: Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"
      - name: Deploy worker
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"
      - name: Deploy scheduler
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_SCHEDULER }}"
      - name: Deploy notification-worker
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION_WORKER }}"
      - name: Deploy frontend
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
